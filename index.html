<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>orbit-calc — calculadora orbital</title>
  <meta name="description" content="Calculadora con consola de nave: cada resultado se lanza a una órbita y queda como satélite reutilizable.">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="assets/starfield.js"></script>
  <script defer src="js/engine.js"></script>
  <script defer src="js/orbits.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <div class="page">
    <header class="page-head">
      <a class="brand" href="./" aria-label="orbit-calc, inicio">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <ellipse class="brand-orbit" cx="16" cy="16" rx="13" ry="6.5" fill="none" stroke-width="1.5" stroke-dasharray="1.5 3.2" stroke-linecap="round" transform="rotate(-24 16 16)"/>
          <circle cx="16" cy="16" r="6" fill="#c9a27e"/>
          <circle class="brand-sat" cx="27.4" cy="10.6" r="2.4"/>
        </svg>
        orbit-calc
      </a>
      <p class="console" id="status" role="status">status: <b>listo para lanzar</b></p>
      <button type="button" class="theme-toggle" data-theme-toggle role="switch" aria-checked="false" aria-label="Modo claro">
        <span class="theme-toggle-thumb" aria-hidden="true">
          <svg class="theme-toggle-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="currentColor"/></svg>
          <svg class="theme-toggle-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </button>
    </header>

    <main class="layout">
      <h1 class="sr-only">orbit-calc: calculadora con historial en órbita</h1>

      <section class="calc panel" aria-label="Calculadora">
        <div class="calc-head">
          <span class="console">consola de vuelo</span>
          <span class="calc-leds" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>

        <div class="display">
          <div class="display-sub mono" id="sub" aria-hidden="true">&nbsp;</div>
          <div class="display-main mono" id="main" data-size="l" aria-hidden="true">0</div>
          <p class="sr-only" id="announce" aria-live="polite"></p>
        </div>

        <div class="keys" role="group" aria-label="Teclado de la calculadora">
          <button type="button" class="key key--danger" data-key="clear" aria-label="Borrar todo">AC</button>
          <button type="button" class="key key--fn" data-key="(" aria-label="Abrir paréntesis">(</button>
          <button type="button" class="key key--fn" data-key=")" aria-label="Cerrar paréntesis">)</button>
          <button type="button" class="key key--op" data-key="/" aria-label="Dividir">÷</button>

          <button type="button" class="key" data-key="7">7</button>
          <button type="button" class="key" data-key="8">8</button>
          <button type="button" class="key" data-key="9">9</button>
          <button type="button" class="key key--op" data-key="*" aria-label="Multiplicar">×</button>

          <button type="button" class="key" data-key="4">4</button>
          <button type="button" class="key" data-key="5">5</button>
          <button type="button" class="key" data-key="6">6</button>
          <button type="button" class="key key--op" data-key="-" aria-label="Restar">−</button>

          <button type="button" class="key" data-key="1">1</button>
          <button type="button" class="key" data-key="2">2</button>
          <button type="button" class="key" data-key="3">3</button>
          <button type="button" class="key key--op" data-key="+" aria-label="Sumar">+</button>

          <button type="button" class="key" data-key="0">0</button>
          <button type="button" class="key" data-key="." aria-label="Coma decimal">,</button>
          <button type="button" class="key key--fn" data-key="back" aria-label="Borrar el último carácter">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5-6 5-6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m12 10 4 4m0-4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="key key--go" data-key="equals" aria-label="Igual: calcular y lanzar a órbita">=</button>
        </div>

        <p class="calc-hint console">teclado físico: <b>0–9 + − * / ( )</b> · <b>Enter</b> lanza · <b>Esc</b> borra</p>
      </section>

      <section class="stage" id="stage" aria-label="Historial en órbita">
        <svg class="stage-svg" id="sky" viewBox="-300 -300 600 600" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Satélites con los resultados anteriores orbitando Plutón">
          <defs>
            <clipPath id="pluto-clip"><circle cx="60" cy="60" r="52"/></clipPath>
            <radialGradient id="pluto-light" cx="36%" cy="30%" r="80%">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
              <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
              <stop class="pluto-shade" offset="1" stop-opacity="0.5"/>
            </radialGradient>
          </defs>

          <g id="rings"></g>
          <circle id="pulse" class="pulse" r="42"/>

          <g class="pluto" transform="translate(-46 -46) scale(0.7667)" aria-hidden="true">
            <circle cx="60" cy="60" r="52" fill="#c9a27e"/>
            <g clip-path="url(#pluto-clip)">
              <path d="M2 70 C18 60 30 74 44 68 C52 65 54 76 46 84 C34 94 14 92 2 86 Z" fill="#8a6548" opacity="0.75"/>
              <path d="M22 18 C40 6 80 6 98 20 C84 26 70 22 58 26 C44 30 32 24 22 18 Z" fill="#b98a66" opacity="0.7"/>
              <path d="M74 50 C80 42 93 44 95 55 C97 66 86 76 76 88 C66 79 55 72 54 62 C53 52 66 46 74 50 Z" fill="#efe3d3"/>
              <path d="M74 50 C70 58 70 68 76 88 C66 79 55 72 54 62 C53 52 66 46 74 50 Z" fill="#fbf5ec" opacity="0.55"/>
              <circle cx="34" cy="44" r="4" fill="#a67d5c" opacity="0.6"/>
              <circle cx="48" cy="34" r="2.2" fill="#a67d5c" opacity="0.5"/>
              <circle cx="40" cy="98" r="3" fill="#a67d5c" opacity="0.5"/>
              <circle cx="92" cy="86" r="2.4" fill="#a67d5c" opacity="0.45"/>
              <circle cx="60" cy="60" r="52" fill="url(#pluto-light)"/>
            </g>
          </g>

          <g id="trails" aria-hidden="true"></g>
          <g id="sats"></g>
        </svg>

        <p class="stage-hud stage-hud--tl console">satélites: <b id="count">0/8</b></p>
        <button type="button" class="stage-clear" id="deorbit" hidden>desorbitar todo</button>
        <p class="stage-hud stage-hud--bl console" id="hint">sin satélites · calcula algo para lanzar el primero</p>
      </section>
    </main>

    <footer class="page-foot">
      <span>orbit-calc · serie Plutón</span>
      <span>hecho por <a href="https://github.com/diegocedenno">diegocedenno</a> · MIT</span>
    </footer>
  </div>
</body>
</html>
